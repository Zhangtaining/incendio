server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js)$ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }
}
